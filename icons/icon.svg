<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16306e"/><stop offset="1" stop-color="#071026"/></linearGradient>
    <linearGradient id="pt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f0"/><stop offset="1" stop-color="#f5f0e3"/></linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece5d2"/><stop offset="1" stop-color="#e2d9c2"/></linearGradient>
    <linearGradient id="ring" x1="0" x2="1"><stop offset="0" stop-color="#6f7b96"/><stop offset=".45" stop-color="#f1f4fa"/><stop offset="1" stop-color="#5d6884"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" RX/>
  <g transform="translate(256 262) scale(SCALE) translate(-256 -262)">
    <!-- calendar body -->
    <rect x="86" y="96" width="340" height="340" rx="36" fill="#13254f" stroke="#2b4386" stroke-width="4"/>
    <!-- header: SPM -->
    <text x="256" y="186" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="84" letter-spacing="2" fill="#ffffff">SPM</text>
    <!-- flip card: GO! -->
    <rect x="114" y="212" width="284" height="98" rx="18" fill="url(#pt)"/>
    <rect x="114" y="292" width="284" height="18" fill="url(#pt)"/>
    <rect x="114" y="310" width="284" height="98" rx="18" fill="url(#pb)"/>
    <rect x="114" y="310" width="284" height="18" fill="url(#pb)"/>
    <text x="256" y="364" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="138" letter-spacing="-5" fill="#0c1938">GO<tspan fill="#e0a800">!</tspan></text>
    <rect x="114" y="307" width="284" height="6" fill="#0c1938" opacity=".55"/>
    <!-- rings -->
    <g fill="url(#ring)"><rect x="160" y="70" width="18" height="52" rx="9"/><rect x="334" y="70" width="18" height="52" rx="9"/></g>
  </g>
</svg>
